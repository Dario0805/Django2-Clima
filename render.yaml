# Render: configuración del servicio web.
# Usa la base PostgreSQL ya creada en Render (open-meteo) mediante DATABASE_URL.
# Build: instala dependencias, recolecta estáticos y migra (ver Backend/build.sh).
# Start: gunicorn sirve Django; WhiteNoise entrega estáticos y el panel de React
# (el build de Vite ya está subido en Backend/static_frontend/).

services:
  - type: web
    name: taller-clima
    runtime: python
    plan: free
    region: oregon
    rootDir: Backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
