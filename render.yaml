# Render — configuración del servicio web.
# Crea una base de datos PostgreSQL en Render y enlázala con DATABASE_URL.
# Build: instala Python y Node, empaqueta el frontend y recolecta estáticos.
# Start: gunicorn sirve Django; whitenoise entrega estáticos y panel de React.

 databases:
   - name: taller-clima-db
     databaseName: taller_clima
     user: taller_clima_user
     plan: free

 services:
   - type: web
     name: taller-clima
     runtime: python
     plan: free
     rootDir: Backend
     buildCommand: |
       pip install -r requirements.txt
       cd ../Frontend && npm ci && npm run build
       cd ../Backend && python manage.py collectstatic --noinput
       python manage.py migrate
     startCommand: gunicorn config.wsgi:application --log-file -
     envVars:
       - key: SECRET_KEY
         generateValue: true
       - key: DEBUG
         value: False
       - key: DATABASE_URL
         fromDatabase:
           name: taller-clima-db
           property: connectionString
       - key: ALLOWED_HOSTS
         value: .onrender.com
       - key: CSRF_TRUSTED_ORIGINS
         value: https://taller-clima.onrender.com
